<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #f7f7f8; --surface: #ffffff; --border: #e5e5ea; --text: #1d1d1f; --text-dim: #6e6e73;
    --accent: #0071e3; --accent-deep: #0058b0;
    --good: #1e8e3e; --good-bg: #e6f4ea; --warn: #c77c00; --warn-bg: #fdf0dc; --bad: #d93025; --bad-bg: #fbe7e6;
    --font-display: "Outfit", system-ui, -apple-system, sans-serif;
    --font-body: "Manrope", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-host-theme="light"]) {
      --bg: #1c1c1e; --surface: #28282b; --border: #3a3a3d; --text: #f5f5f7; --text-dim: #a1a1a6;
      --accent: #2997ff; --accent-deep: #6cb4ff;
      --good: #34c759; --good-bg: rgba(52,199,89,0.16); --warn: #ffb340; --warn-bg: rgba(255,179,64,0.16);
      --bad: #ff6961; --bad-bg: rgba(255,105,97,0.16);
    }
  }
  :root[data-host-theme="dark"] {
    --bg: #1c1c1e; --surface: #28282b; --border: #3a3a3d; --text: #f5f5f7; --text-dim: #a1a1a6;
    --accent: #2997ff; --accent-deep: #6cb4ff;
    --good: #34c759; --good-bg: rgba(52,199,89,0.16); --warn: #ffb340; --warn-bg: rgba(255,179,64,0.16);
    --bad: #ff6961; --bad-bg: rgba(255,105,97,0.16);
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 13px; }
  .empty { color: var(--text-dim); padding: 24px 4px; text-align: center; }
  .toolbar { display: flex; justify-content: flex-end; margin-bottom: 10px; }
  .toolbar label { display: flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 12px; cursor: pointer; }
  .board { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
  .column { flex: 0 0 200px; display: flex; flex-direction: column; gap: 8px; }
  .column-head { display: flex; align-items: center; justify-content: space-between; font-family: var(--font-display); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-dim); padding: 0 2px; }
  .column-count { background: var(--border); color: var(--text); border-radius: 999px; padding: 1px 7px; font-size: 11px; }
  .column-cards { display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 11px; display: flex; flex-direction: column; gap: 5px; }
  .card.archived { opacity: 0.55; }
  .title { font-weight: 700; font-size: 13px; line-height: 1.3; overflow-wrap: anywhere; }
  .company { color: var(--text-dim); font-size: 12px; }
  .score { align-self: flex-start; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
  .score.good { background: var(--good-bg); color: var(--good); }
  .score.warn { background: var(--warn-bg); color: var(--warn); }
  .score.bad { background: var(--bad-bg); color: var(--bad); }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .tag { font-size: 10px; color: var(--text-dim); border: 1px solid var(--border); border-radius: 6px; padding: 1px 5px; }
  .notes { color: var(--text-dim); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  select.status { font: inherit; font-size: 11.5px; border: 1px solid var(--border); border-radius: 7px; padding: 3px 5px; background: var(--surface); color: var(--text); }
</style>
</head>
<body>
<div id="root"><p class="empty">Loading…</p></div>
<script>
  const STATUSES = ["saved", "applied", "interviewing", "offer", "rejected", "withdrawn"];

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function titleCase(s) {
    return String(s ?? "").replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
  }
  function scoreClass(score) {
    if (score == null) return null;
    if (score >= 75) return "good";
    if (score >= 50) return "warn";
    return "bad";
  }

  let bridge;

  function createBridge(onData) {
    if (window.openai) {
      const apply = () => onData(window.openai.toolOutput);
      window.addEventListener("openai:set_globals", apply);
      if (window.openai.toolOutput) apply();
      return {
        callTool: (name, args) => window.openai.callTool(name, args),
      };
    }
    let nextId = 1;
    const pending = new Map();
    function send(method, params) {
      return new Promise((resolve, reject) => {
        const id = nextId++;
        pending.set(id, { resolve, reject });
        window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
      });
    }
    function notify(method, params) {
      window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
    }
    window.addEventListener("message", (event) => {
      const msg = event.data;
      if (!msg || msg.jsonrpc !== "2.0") return;
      if (msg.id !== undefined && pending.has(msg.id)) {
        const { resolve, reject } = pending.get(msg.id);
        pending.delete(msg.id);
        if (msg.error) reject(msg.error); else resolve(msg.result);
        return;
      }
      if (msg.method === "ui/notifications/tool-result") {
        onData(msg.params && msg.params.structuredContent);
      }
      if (msg.method === "ui/notifications/host-context-changed") {
        const theme = msg.params && msg.params.hostContext && msg.params.hostContext.theme;
        if (theme) document.documentElement.dataset.hostTheme = theme;
      }
    });
    (async () => {
      const result = await send("ui/initialize", {
        protocolVersion: "2026-01-26",
        appCapabilities: { availableDisplayModes: ["inline"] },
      });
      const theme = result && result.hostContext && result.hostContext.theme;
      if (theme) document.documentElement.dataset.hostTheme = theme;
      notify("ui/notifications/initialized", {});
    })();
    return {
      callTool: (name, args) => send("tools/call", { name, arguments: args }),
    };
  }

  let applications = [];
  let showArchived = false;

  function cardHtml(app) {
    const job = app.job_posting || {};
    const sClass = scoreClass(app.best_score);
    const tags = [];
    if (app.latest_tailored_resume) tags.push('<span class="tag">Tailored resume</span>');
    if (app.latest_cover_letter) tags.push('<span class="tag">Cover letter</span>');
    const options = STATUSES.map(
      (s) => '<option value="' + s + '"' + (s === app.status ? " selected" : "") + ">" + titleCase(s) + "</option>"
    ).join("");
    return (
      '<div class="card' + (app.is_archived ? " archived" : "") + '" data-id="' + escapeHtml(app.id) + '">' +
      '<div class="title">' + escapeHtml(job.title || "Untitled posting") + "</div>" +
      '<div class="company">' + escapeHtml(job.company_name || "Unknown company") + "</div>" +
      (app.best_score != null ? '<span class="score ' + sClass + '">' + app.best_score + "% fit</span>" : "") +
      (tags.length ? '<div class="tags">' + tags.join("") + "</div>" : "") +
      (app.notes ? '<div class="notes">' + escapeHtml(app.notes) + "</div>" : "") +
      '<select class="status" data-role="status">' + options + "</select>" +
      "</div>"
    );
  }

  function moveCard(id, newStatus) {
    const app = applications.find((a) => a.id === id);
    if (!app) return;
    const previous = app.status;
    app.status = newStatus;
    render(null, true);
    bridge.callTool("update_application", { application_id: id, status: newStatus }).catch(() => {
      app.status = previous;
      render(null, true);
    });
  }

  function render(data, skipDataUpdate) {
    if (!skipDataUpdate) {
      const list = data && data.result;
      if (!Array.isArray(list)) {
        document.getElementById("root").innerHTML = '<p class="empty">No applications yet.</p>';
        return;
      }
      applications = list;
    }
    const root = document.getElementById("root");
    root.innerHTML = "";

    const toolbar = document.createElement("div");
    toolbar.className = "toolbar";
    toolbar.innerHTML =
      '<label><input type="checkbox" data-role="show-archived"' + (showArchived ? " checked" : "") + " /> Show archived</label>";
    toolbar.querySelector('[data-role="show-archived"]').addEventListener("change", (e) => {
      showArchived = e.target.checked;
      render(null, true);
    });
    root.appendChild(toolbar);

    const visible = applications.filter((a) => showArchived || !a.is_archived);
    if (visible.length === 0) {
      const empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "No applications to show.";
      root.appendChild(empty);
      return;
    }

    const board = document.createElement("div");
    board.className = "board";
    for (const status of STATUSES) {
      const inColumn = visible.filter((a) => a.status === status);
      const column = document.createElement("div");
      column.className = "column";
      column.innerHTML =
        '<div class="column-head"><span>' + titleCase(status) + '</span><span class="column-count">' + inColumn.length + "</span></div>" +
        '<div class="column-cards">' + inColumn.map(cardHtml).join("") + "</div>";
      column.querySelectorAll('[data-role="status"]').forEach((sel) => {
        sel.addEventListener("change", (e) => {
          const id = e.target.closest(".card").dataset.id;
          moveCard(id, e.target.value);
        });
      });
      board.appendChild(column);
    }
    root.appendChild(board);
  }

  bridge = createBridge(render);
</script>
</body>
</html>
