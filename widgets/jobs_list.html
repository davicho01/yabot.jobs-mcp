<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #f7f7f8; --surface: #ffffff; --border: #e5e5ea; --text: #1d1d1f; --text-dim: #6e6e73;
    --accent: #0071e3; --accent-deep: #0058b0; --good: #1e8e3e; --good-bg: #e6f4ea;
    --font-display: "Outfit", system-ui, -apple-system, sans-serif;
    --font-body: "Manrope", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-host-theme="light"]) {
      --bg: #1c1c1e; --surface: #28282b; --border: #3a3a3d; --text: #f5f5f7; --text-dim: #a1a1a6;
      --accent: #2997ff; --accent-deep: #6cb4ff; --good: #34c759; --good-bg: rgba(52,199,89,0.16);
    }
  }
  :root[data-host-theme="dark"] {
    --bg: #1c1c1e; --surface: #28282b; --border: #3a3a3d; --text: #f5f5f7; --text-dim: #a1a1a6;
    --accent: #2997ff; --accent-deep: #6cb4ff; --good: #34c759; --good-bg: rgba(52,199,89,0.16);
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 13px; }
  .empty { color: var(--text-dim); padding: 24px 4px; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .card--pending { opacity: 0.6; }
  .title { font-family: var(--font-display); font-weight: 700; font-size: 14.5px; line-height: 1.3; overflow-wrap: anywhere; }
  .company { color: var(--text-dim); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badges { display: flex; flex-wrap: wrap; gap: 5px; margin: 2px 0; }
  .badge { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; padding: 3px 7px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent-deep); white-space: nowrap; }
  .meta { color: var(--text-dim); font-size: 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
  .link { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 12.5px; cursor: pointer; }
  .link:hover { text-decoration: underline; }
  button.track { appearance: none; border: 1px solid var(--accent); background: transparent; color: var(--accent); font: inherit; font-weight: 700; font-size: 12px; padding: 5px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  button.track:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  button.track[disabled] { border-color: var(--good); color: var(--good); background: var(--good-bg); cursor: default; }
  button.track.error { border-color: #d93025; color: #d93025; }
  .footer { margin-top: 12px; color: var(--text-dim); font-size: 11.5px; text-align: center; }
</style>
</head>
<body>
<div id="root"><p class="empty">Loading…</p></div>
<script>
  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function fmtSalary(min, max, currency) {
    if (!min && !max) return null;
    const fmt = (n) => {
      try { return new Intl.NumberFormat(undefined, { style: "currency", currency: currency || "USD", maximumFractionDigits: 0 }).format(n); }
      catch { return "$" + n; }
    };
    if (min && max && min !== max) return fmt(min) + " – " + fmt(max);
    return fmt(min || max);
  }
  function fmtRelative(dateStr) {
    if (!dateStr) return null;
    const then = new Date(dateStr).getTime();
    if (Number.isNaN(then)) return null;
    const days = Math.floor((Date.now() - then) / 86400000);
    if (days <= 0) return "today";
    if (days === 1) return "1 day ago";
    if (days < 30) return days + " days ago";
    const months = Math.floor(days / 30);
    return months === 1 ? "1 month ago" : months + " months ago";
  }
  function titleCase(s) {
    return String(s ?? "").replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
  }

  function createBridge(onData) {
    if (window.openai) {
      const apply = () => onData(window.openai.toolOutput);
      window.addEventListener("openai:set_globals", apply);
      if (window.openai.toolOutput) apply();
      return {
        callTool: (name, args) => window.openai.callTool(name, args),
        openLink: (url) => window.open(url, "_blank", "noopener"),
      };
    }
    let nextId = 1;
    const pending = new Map();
    function send(method, params) {
      return new Promise((resolve, reject) => {
        const id = nextId++;
        pending.set(id, { resolve, reject });
        window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
      });
    }
    function notify(method, params) {
      window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
    }
    window.addEventListener("message", (event) => {
      const msg = event.data;
      if (!msg || msg.jsonrpc !== "2.0") return;
      if (msg.id !== undefined && pending.has(msg.id)) {
        const { resolve, reject } = pending.get(msg.id);
        pending.delete(msg.id);
        if (msg.error) reject(msg.error); else resolve(msg.result);
        return;
      }
      if (msg.method === "ui/notifications/tool-result") {
        onData(msg.params && msg.params.structuredContent);
      }
      if (msg.method === "ui/notifications/host-context-changed") {
        const theme = msg.params && msg.params.hostContext && msg.params.hostContext.theme;
        if (theme) document.documentElement.dataset.hostTheme = theme;
      }
    });
    (async () => {
      const result = await send("ui/initialize", {
        protocolVersion: "2026-01-26",
        appCapabilities: { availableDisplayModes: ["inline"] },
      });
      const theme = result && result.hostContext && result.hostContext.theme;
      if (theme) document.documentElement.dataset.hostTheme = theme;
      notify("ui/notifications/initialized", {});
    })();
    return {
      callTool: (name, args) => send("tools/call", { name, arguments: args }),
      openLink: (url) => send("ui/open-link", { url }),
    };
  }

  let bridge;

  function trackApplication(btn, submittedUrl) {
    btn.disabled = true;
    btn.textContent = "Tracking…";
    bridge.callTool("apply_to_job", { url: submittedUrl }).then(() => {
      btn.textContent = "✓ Tracked";
    }).catch(() => {
      btn.disabled = false;
      btn.classList.add("error");
      btn.textContent = "Retry";
    });
  }

  function render(data) {
    const root = document.getElementById("root");
    if (!data || !Array.isArray(data.items) || data.items.length === 0) {
      root.innerHTML = '<p class="empty">No jobs found.</p>';
      return;
    }
    root.innerHTML = "";
    const grid = document.createElement("div");
    grid.className = "grid";
    for (const item of data.items) {
      const posting = item.posting;
      const card = document.createElement("div");
      card.className = "card" + (posting ? "" : " card--pending");
      if (!posting) {
        card.innerHTML =
          '<div class="title">' + escapeHtml(item.url && item.url.domain) + "</div>" +
          '<div class="meta">Still scanning this posting…</div>';
        grid.appendChild(card);
        continue;
      }
      const badges = [];
      if (posting.workplace_type) badges.push('<span class="badge">' + escapeHtml(titleCase(posting.workplace_type)) + "</span>");
      if (posting.employment_type) badges.push('<span class="badge">' + escapeHtml(titleCase(posting.employment_type)) + "</span>");
      const salary = fmtSalary(posting.salary_min, posting.salary_max, posting.salary_currency);
      const relative = fmtRelative(posting.posted_at);
      card.innerHTML =
        '<div class="title">' + escapeHtml(posting.title || "Untitled posting") + "</div>" +
        '<div class="company">' + escapeHtml(posting.company_name || "Unknown company") + "</div>" +
        (badges.length ? '<div class="badges">' + badges.join("") + "</div>" : "") +
        (posting.location ? '<div class="meta">📍 ' + escapeHtml(posting.location) + "</div>" : "") +
        (salary ? '<div class="meta">' + escapeHtml(salary) + "</div>" : "") +
        (relative ? '<div class="meta">Posted ' + escapeHtml(relative) + "</div>" : "") +
        '<div class="row">' +
        (posting.apply_url ? '<span class="link" data-role="apply">Apply →</span>' : "<span></span>") +
        '<button class="track" data-role="track">Track</button>' +
        "</div>";
      const applyEl = card.querySelector('[data-role="apply"]');
      if (applyEl) applyEl.addEventListener("click", () => bridge.openLink(posting.apply_url));
      const trackBtn = card.querySelector('[data-role="track"]');
      trackBtn.addEventListener("click", () => trackApplication(trackBtn, item.url && item.url.url));
      grid.appendChild(card);
    }
    root.appendChild(grid);
    const totalPages = Math.max(1, Math.ceil((data.total || 0) / (data.page_size || 20)));
    const footer = document.createElement("div");
    footer.className = "footer";
    footer.textContent = (data.total ?? data.items.length) + " jobs · page " + (data.page ?? 1) + " of " + totalPages;
    root.appendChild(footer);
  }

  bridge = createBridge(render);
</script>
</body>
</html>
