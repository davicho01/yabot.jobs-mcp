name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  PROJECT_ID: yabotjobs
  REGION: us-central1
  SERVICE: yabot-jobs-mcp
  REPOSITORY: yabot-jobs-mcp
  IMAGE: us-central1-docker.pkg.dev/yabotjobs/yabot-jobs-mcp/yabot-jobs-mcp

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: docker build -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" .

      - name: Push image
        run: |
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "YABOT_API_BASE_URL=${{ vars.YABOT_API_BASE_URL }},YABOT_FRONTEND_BASE_URL=${{ vars.YABOT_FRONTEND_BASE_URL }},YABOT_MCP_PUBLIC_URL=${{ vars.YABOT_MCP_PUBLIC_URL }}"
